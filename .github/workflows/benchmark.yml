name: GitHub ARM Benchmark

on:
  workflow_dispatch:
    inputs:
      main_ref:
        description: Upstream TypeScript revision
        default: '5d53fdd36f32cedd6ee5c80a6aebd47105a69e8c'
        required: true
        type: string
      rust_ref:
        description: Fork Rust revision
        default: 'f213fe0bce1162496d90302145cf48e8e7929330'
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/tscircuit-autorouter
          ref: ${{ inputs.main_ref }}
          path: typescript
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Serdnad/tscircuit-autorouter
          ref: ${{ inputs.rust_ref }}
          path: rust
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Record environment
        run: |
          mkdir -p results
          lscpu > results/hardware.txt
          free -h >> results/hardware.txt
          df -h >> results/hardware.txt
          cat results/hardware.txt
          bun --version > results/bun-version.txt
          git -C typescript rev-parse HEAD > results/typescript-sha.txt
          git -C rust rev-parse HEAD > results/rust-sha.txt
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: bun install
      - name: Install Rust adapter dependencies
        working-directory: rust
        run: bun install
      - name: Build WASM
        uses: ./controller/.github/actions/prepare-bindings
        with:
          working-directory: rust
      - name: Save runner metadata
        uses: actions/upload-artifact@v4
        with:
          name: runner-metadata
          path: results
      - name: Run TypeScript SRJ18 benchmark
        run: python3 controller/scripts/benchmark/github-arm-comparison.py typescript
      - name: Save TypeScript results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-srj18
          path: results
      - name: Run Rust SRJ18 benchmark
        run: python3 controller/scripts/benchmark/github-arm-comparison.py rust
      - name: Compare results
        run: python3 controller/scripts/benchmark/github-arm-comparison.py report
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srj18-github-arm-comparison
          path: results
          if-no-files-found: error
